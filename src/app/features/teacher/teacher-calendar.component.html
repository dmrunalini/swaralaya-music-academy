<div class="calendar-wrap">
  <table class="calendar-table">
    <thead>
      <tr>
        <th>Time</th>
        <th *ngFor="let day of calendarDays">
          {{ weekDays[day.getDay()] }}<br>{{ day | date:'MMM d' }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let slot of timeSlots">
        <td>{{ slot }}</td>
        <td *ngFor="let day of calendarDays">
          <ng-container *ngFor="let c of getClassesForDay(day)">
            <div *ngIf="isClassInSlot(c, slot, day)" class="class-block" (click)="openRescheduleModal(c)">
              <div>{{ c.startTimeUtc | date:'shortTime' }} - {{ c.endTimeUtc | date:'shortTime' }}</div>
            </div>
          </ng-container>

          <!-- click empty cell to add class for that day+slot -->
          <div class="empty-slot" (click)="openAddClassModal(day.toISOString().slice(0,10))"></div>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="calendar-actions">
    <button (click)="openAddClassModal()">Add New Class</button>
  </div>
</div>

<!-- Add New Class Modal -->
<div class="modal-backdrop" *ngIf="showAddClassModal" (click)="closeAddClassModal()"></div>
<div class="modal" *ngIf="showAddClassModal">
  <div class="modal-header"><h3>Add New Class</h3><button class="close" (click)="closeAddClassModal()">×</button></div>
  <div class="modal-body">
    <form #addClassForm="ngForm">
      <label>Date:
        <input type="date" [(ngModel)]="newClass.date" name="date" required (change)="onDateOrDurationChange()" />
      </label>

      <label>Start Time:
        <select [(ngModel)]="newClass.startTime" name="startTime" required>
          <option *ngFor="let slot of availableSlots" [value]="slot">{{ slot | date:'shortTime' }}</option>
        </select>
      </label>

      <label>Duration:
        <select [(ngModel)]="newClass.durationMinutes" name="durationMinutes" required (change)="onDateOrDurationChange()">
          <option [value]="30">30 min</option>
          <option [value]="45">45 min</option>
          <option [value]="60">60 min</option>
        </select>
      </label>

      <label>Student ID:
        <input [(ngModel)]="newClass.studentId" name="studentId" />
      </label>

      <div class="muted">Time zone: <strong>{{ tz }}</strong></div>
    </form>
  </div>
  <div class="modal-actions">
    <button class="approve" (click)="addClass()" [disabled]="busy">Create</button>
    <button class="muted-btn" (click)="closeAddClassModal()">Cancel</button>
  </div>
</div>

<!-- Reschedule Modal -->
<div class="modal-backdrop" *ngIf="showRescheduleModal" (click)="closeRescheduleModal()"></div>
<div class="modal" *ngIf="showRescheduleModal">
  <div class="modal-header">
    <h3>Reschedule Class</h3>
    <button class="close" (click)="closeRescheduleModal()">×</button>
  </div>
  <div class="modal-body">
    <form #rescheduleForm="ngForm">
      <label>Date:
        <input type="date" [(ngModel)]="rescheduleDate" name="rescheduleDate" (change)="onRescheduleDateOrDurationChange()" required />
      </label>

      <label>Start Time:
        <select [(ngModel)]="rescheduleStartTime" name="rescheduleStartTime" required>
          <option *ngFor="let slot of rescheduleAvailableSlots" [value]="slot">{{ slot | date:'shortTime' }}</option>
        </select>
      </label>

      <label>Duration:
        <select [(ngModel)]="rescheduleDurationMinutes" name="rescheduleDurationMinutes" (change)="onRescheduleDateOrDurationChange()">
          <option [value]="30">30 min</option>
          <option [value]="45">45 min</option>
          <option [value]="60">60 min</option>
        </select>
      </label>

      <div class="muted">Time zone: <strong>{{ tz }}</strong></div>
    </form>
  </div>
  <div class="modal-actions">
    <button class="approve" (click)="rescheduleClass()" [disabled]="busy">Save</button>
    <button class="danger" (click)="closeAndCancelClass(selectedClass?.id)">Cancel Class</button>
    <button class="muted-btn" (click)="closeRescheduleModal()">Close</button>
  </div>
</div>

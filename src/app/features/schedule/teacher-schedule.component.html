<div class="wrap">
  <h2>Teacher Schedule</h2>

  <section class="card">
    <h3>Create session</h3>
    <div class="grid">
      <input [(ngModel)]="title" placeholder="Title" />
      <input [(ngModel)]="studentIdsCsv" placeholder="Student IDs (comma-separated UIDs)" />
      <input [(ngModel)]="startLocal" type="datetime-local" />
      <input [(ngModel)]="endLocal" type="datetime-local" />
      <textarea [(ngModel)]="notes" rows="3" placeholder="Notes (optional)"></textarea>
    </div>
    <button (click)="create()" [disabled]="busy">Create</button>
  </section>

  <section class="card">
    <h3>Upcoming</h3>
    <div *ngIf="classes.length === 0" class="muted">No sessions yet.</div>
    <div *ngFor="let c of classes" class="row">
      <div class="col">
        <div class="t">{{ c.title }}</div>
        <div class="m muted">{{ fmt(c.startUtc) }} – {{ fmt(c.endUtc) }}</div>
        <div class="m">Students: {{ c.studentIds.length ? c.studentIds.join(', ') : '—' }}</div>
        <div class="m" *ngIf="c.location as loc">
          <a *ngIf="loc.type === 'link'" [routerLink]="loc.value">Join video</a>
        </div>
        <div class="m" *ngIf="c.status === 'cancelled'">Status: cancelled</div>
      </div>
      <div class="actions">
        <button (click)="cancel(c)" [disabled]="c.status === 'cancelled'">Cancel</button>
      </div>
    </div>
  </section>
</div>
